# 🐣 바이브삐약 오픈소스 모닝 브리핑 — 매일 아침 자동 발행 (07:17 KST 예약)
# 비밀값은 저장소 Settings ▸ Secrets and variables ▸ Actions 에 둔다:
#   GEMINI_API_KEY, DISCORD_WEBHOOK_URL
# 실행이 끝나면 output/ 과 store/ 변경을 저장소에 커밋해 실행 기록을 쌓는다.
name: newsletter

on:
  schedule:
    # UTC 22:17 = KST 07:17. 정각(0분)은 GitHub 스케줄 고부하 시간이라 피한다 —
    # "0 23 * * *" 였던 10/30 첫 예약 실행은 3시간 12분 늦은 11:12 KST 에야 돌았다.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 이면 디스코드로 보내지 않고 파일만 만든다"
        required: false
        default: "0"

permissions:
  contents: write   # output/·store/ 커밋용

concurrency:
  group: newsletter   # 두 실행이 겹쳐 metrics.jsonl 커밋이 충돌하지 않게
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 스타 순위용 GitHub API (시간당 60회 → 1000회)
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          RUN_TRIGGER: ${{ github.event_name }}
          PYTHONIOENCODING: utf-8
        run: python run.py

      - name: Commit run records
        if: always()   # 실패한 실행의 기록(store/metrics.jsonl)도 남긴다
        run: |
          git config user.name "coding-ppiyak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output store
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "chore(run): 뉴스레터 실행 기록 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST [${{ github.event_name }}]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
